# Upload service for the web admin (matthewfregnan.com/admin): lets a signed-in admin upload videos
# into the R2 video bucket in chunks. Deploy from this folder with:  npx wrangler@3 deploy
name = "matthewfregnan-upload"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = false

routes = [
  { pattern = "upload.matthewfregnan.com", custom_domain = true }
]

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "matthewfregnan-videos"

[vars]
REPO = "MatthewFregnan/matthewfregnan-website"

# Anonymous visit stats for the admin's Traffic page (schema.sql)
[[d1_databases]]
binding = "STATS"
database_name = "matthewfregnan-stats"
database_id = "f34f23ec-4560-4bb7-ba71-6474aac27396"

# Contact form messages are emailed through Cloudflare Email Routing. To switch it on:
#   1. Cloudflare dashboard → matthewfregnan.com → Email → Email Routing: enable it, and add + verify
#      the address messages should go to (Destination addresses).
#   2. Uncomment the lines below (MAIL_TO must be that verified address) and deploy.
# Until then messages are still saved and shown in the admin's Inbox.
# [[send_email]]
# name = "MAIL"
# destination_address = "you@example.com"
# [vars] additions (put these in the [vars] table above):
#   MAIL_FROM = "website@matthewfregnan.com"
#   MAIL_TO = "you@example.com"
