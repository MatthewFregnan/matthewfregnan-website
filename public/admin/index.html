<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c1d20" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)">
  <title>Portfolio Manager</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Sign in -->
  <div id="signin" class="signin" hidden>
    <form class="signin-card" id="signin-form">
      <h1>Portfolio Manager</h1>
      <p class="muted">Edit the projects on matthewfregnan.com. Changes go live a minute or two after you publish.</p>
      <label for="token">GitHub access token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" required>
      <p id="signin-error" class="error" hidden></p>
      <button class="btn primary" type="submit">Sign In</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="toolbar" role="toolbar">
      <button class="btn icon mobile-only proj-only" id="back" aria-label="Back to list">‹ Projects</button>
      <div class="tb-group proj-only">
        <button class="btn" id="new-link" title="New project from a video link (N)">New from Link</button>
        <button class="btn desk-only" id="new-file" title="New project from a video file on this computer: it uploads in the background">New from File</button>
        <button class="btn desk-only" id="new-blank">New Blank</button>
        <button class="btn desk-only" id="duplicate">Duplicate</button>
        <button class="btn" id="delete">Delete</button>
      </div>
      <div class="tb-group">
        <button class="btn" id="undo" title="Undo (⌘Z / Ctrl+Z)">Undo</button>
        <button class="btn" id="redo" title="Redo (⇧⌘Z / Ctrl+Y)">Redo</button>
      </div>
      <div class="tb-group proj-only">
        <button class="btn desk-only" id="check" title="Check every video link still plays">Check Videos</button>
        <button class="btn desk-only" id="view" title="Open this project on the live site">View on Site</button>
      </div>
      <div class="tb-spacer"></div>
      <span id="upload-status" class="upload-status" hidden></span>
      <span id="demo-badge" class="badge" hidden>Demo: nothing is saved</span>
      <button class="btn primary" id="publish">Publish</button>
      <button class="btn icon" id="menu" aria-label="Account">⋯</button>
    </header>
    <div class="shell">
    <nav class="rail" id="rail" aria-label="Sections">
      <button data-page="overview"><span aria-hidden="true">◎</span>Overview</button>
      <button data-page="home"><span aria-hidden="true">⌂</span>Home Page</button>
      <button data-page="projects"><span aria-hidden="true">▦</span>Projects</button>
      <button data-page="sections"><span aria-hidden="true">▥</span>Pages</button>
      <button data-page="text"><span aria-hidden="true">✎</span>Site Text</button>
      <button data-page="traffic"><span aria-hidden="true">▤</span>Traffic</button>
      <button data-page="storage"><span aria-hidden="true">◫</span>Storage</button>
      <a class="rail-site" href="https://matthewfregnan.com/" target="_blank" rel="noopener"><span aria-hidden="true">↗</span>Live site</a>
    </nav>
    <main id="page-overview" class="page scroll-page" hidden></main>
    <div id="page-projects" class="page layout" hidden>
      <aside class="sidebar">
        <div class="sidebar-tools">
          <input id="search" type="search" placeholder="Search title, client, production…" autocomplete="off">
          <select id="filter" aria-label="Category"></select>
        </div>
        <nav id="list" class="list" aria-label="Projects"></nav>
      </aside>
      <main id="editor" class="editor"></main>
    </div>
    <main id="page-home" class="page scroll-page" hidden></main>
    <main id="page-sections" class="page scroll-page" hidden></main>
    <main id="page-text" class="page scroll-page" hidden></main>
    <main id="page-traffic" class="page scroll-page" hidden></main>
    <main id="page-storage" class="page scroll-page" hidden></main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <div id="loading" class="loading">Loading…</div>
  <dialog id="dialog"></dialog>
</body>
</html>
